name: Refresh previews

on:
  schedule:
    - cron: '30 3 * * *' # daily, before the profile snake job
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/shots.mjs'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

concurrency:
  group: previews
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # playwright-core's own CLI, so the browser revision always matches the library
      - run: npx playwright-core install --with-deps chromium

      - name: Screenshot every live page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'
        run: npm run shots

      - name: Commit changed previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shots
          if git diff --staged --quiet; then
            echo 'previews unchanged'
          else
            git commit -m 'chore: refresh live page previews'
            git push
          fi
